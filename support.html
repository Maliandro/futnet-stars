    <h2 data-tr="Sık sorulanlar" data-en="FAQ">Sık sorulanlar</h2>

    <h3 data-tr="2 kişilik mod nasıl çalışır?" data-en="How does 2-player mode work?"></h3>
    <p data-tr="İki telefon da aynı WiFi ağına bağlı olmalı (ya da biri hotspot açar, diğeri ona bağlanır). Biri menüden ODA KUR, diğeri KATIL der; maç otomatik başlar. İnternet bağlantısı gerekmez."
       data-en="Both phones must be on the same WiFi network (or one opens a hotspot and the other connects to it). One taps HOST, the other JOIN; the match starts automatically. No internet connection is needed."></p>

    <h3 data-tr="Rakibi bulamıyorum" data-en="I cannot find the other player"></h3>
    <p data-tr="Aynı ağda olduğunuzdan emin olun. Bazı ev ve misafir ağlarında cihazların birbirini görmesi engellenir (&quot;client isolation&quot;); bu durumda telefonlardan biri hotspot açsın, diğeri ona bağlansın."
       data-en="Make sure both phones are on the same network. Some home and guest networks block device-to-device traffic (&quot;client isolation&quot;); in that case open a hotspot on one phone and connect the other to it."></p>

    <h3 data-tr="Oyunu nasıl oynarım?" data-en="How do I play?"></h3>
    <p data-tr="Sol taraftaki joystick ile koşarsınız. Sağdaki düğmeler: DÜZ (normal vuruş), LOB (yüksek top), SMAÇ (sert vuruş), PAS (topu kendinize ya da ortağınıza yükseltir), ZIPLA. Her tarafta 3 dokunuş ve 1 sekme hakkınız var — sektir, yükselt, smaçla!"
       data-en="Use the joystick on the left to run. Buttons on the right: DRIVE (normal shot), LOB (high ball), SMASH (power shot), PASS (pops the ball up for you or your teammate), JUMP. You get 3 touches and 1 bounce per side — bounce, pop, smash!"></p>

    <h3 data-tr="Karakterleri ve mekanları nasıl açarım?" data-en="How do I unlock characters and venues?"></h3>
    <p data-tr="Maç kazanarak oyun içi para biriktirirsiniz. Karakterler Karakterler ekranından satın alınır. Mekanlar ise kupa turnuvalarıyla açılır: Turnuva ekranında kilitli bir mekanı seçip kupayı kazanırsanız o mekan kalıcı olarak açılır."
       data-en="You earn coins by winning matches. Characters are bought from the Characters screen. Venues are unlocked through cup tournaments: pick a locked venue on the Tournament screen and win the cup to unlock it permanently."></p>

    <h3 data-tr="İlerlemem kayboldu" data-en="I lost my progress"></h3>
    <p data-tr="Oyun ilerlemesi yalnızca cihazınızda saklanır. Uygulamayı kaldırırsanız veya uygulama verilerini temizlerseniz ilerleme silinir ve geri getirilemez."
       data-en="Progress is stored only on your device. If you uninstall the App or clear its data, your progress is deleted and cannot be recovered."></p>

    <h3 data-tr="Reklamları kaldırabilir miyim?" data-en="Can I remove the ads?"></h3>
    <p data-tr="Reklamsız seçenek üzerinde çalışıyoruz; bir sonraki güncellemelerde uygulama içi satın alma olarak sunulacak."
       data-en="An ad-free option is in the works and will be offered as an in-app purchase in a future update."></p>

    <h3 data-tr="Ses veya titreşimi nasıl kapatırım?" data-en="How do I turn off sound or vibration?"></h3>
    <p data-tr="Ana menüdeki ⚙ düğmesinden Ayarlar ekranına girin; müzik, ses efektleri, titreşim ve dil buradan değiştirilir."
       data-en="Open Settings with the ⚙ button on the main menu; music, sound effects, vibration and language can all be changed there."></p>
